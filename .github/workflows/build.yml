name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install buildozer
        sudo apt update
        sudo apt install -y git autoconf automake build-essential libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev openjdk-8-jdk
        
    - name: Build APK with Buildozer
      run: |
        buildozer init
        # Update buildozer.spec if needed
        buildozer -v android debug
      
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: expense-tracker-apk
        path: bin/*.apk
